name: Build and push Docker image

on:
  push:
    branches: [main]
  # Lets you rebuild from the Actions tab without pushing a commit.
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The cluster runs on amd64.
          platforms: linux/amd64
          # Two tags on purpose: `latest` is what deploy/deployment.yaml pulls,
          # and the commit SHA gives you an immutable tag to roll back to.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/metadata-analysis-llm-for-sdc:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/metadata-analysis-llm-for-sdc:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
