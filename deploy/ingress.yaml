apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sdc-metadata
  labels:
    app: sdc-metadata
  annotations:
    # app.py accepts workbooks up to 16 MB (MAX_CONTENT_LENGTH). nginx defaults
    # to 1 MB and would return 413 before the request ever reaches Flask, so the
    # two limits have to agree.
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    # The upload endpoint answers 202 immediately, but keep a long read timeout
    # so a slow serialization of a large workbook is never cut off mid-response.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  tls:
    # No secretName: the SSP Cloud ingress controller serves the wildcard
    # certificate for *.lab.sspcloud.fr.
    - hosts:
        - sdc-metadata.lab.sspcloud.fr
  rules:
    - host: sdc-metadata.lab.sspcloud.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sdc-metadata
                port:
                  number: 5000
